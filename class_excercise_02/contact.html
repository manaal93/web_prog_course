<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="design.css">
<script src="contact-form.js" defer></script>
<style>
body, html {
    height: 100%;
    font-family: "Inconsolata", sans-serif;
}

.page-hero {
    background-position: center;
    background-size: cover;
    background-image: url("https://capital-placement.com/wp-content/uploads/2020/12/career-development.png");
    min-height: 45%;
}
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleNav()">☰</button>

<div class="sidenav" id="mySidenav">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <button class="dropdown-btn" onclick="toggleDropdown()">PORTFOLIO ▼</button>
    <div class="dropdown-container" id="dropdown">
        <a href="portfolio.html">Portfolio</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
    </div>
    <a href="contact.html">CONTACT</a>
</div>

<div class="main-content">

<header class="page-hero w3-display-container w3-grayscale-min">
    <div class="w3-display-middle w3-center">
        <span class="w3-text-white" style="font-size:64px">Contact</span>
    </div>
</header>

<div class="w3-sand w3-grayscale w3-large">
    <div class="w3-container w3-padding-64">
        <div class="w3-content" style="max-width:700px">
            <h5 class="w3-center w3-padding-16"><span class="w3-tag w3-wide">GET IN TOUCH</span></h5>
            <p>Feel free to reach out with any questions or opportunities.</p>
            <form id="contactForm" onsubmit="return false;">
                <p><input class="w3-input w3-padding-16 w3-border" type="text" id="name" placeholder="Name" required name="name"></p>
                <p><input class="w3-input w3-padding-16 w3-border" type="email" id="email" placeholder="Email" required name="email"></p>
                <p><textarea class="w3-input w3-padding-16 w3-border" id="message" placeholder="Message" required name="message" rows="5"></textarea></p>
                <p>
                    <button class="w3-button w3-black" type="submit">Send Message</button>
                    <button class="w3-button w3-light-grey" type="button" onclick="resetContactForm()" style="margin-left:10px;">Clear Form</button>
                </p>
            </form>
        </div>
    </div>
</div>

<footer class="w3-center w3-light-grey w3-padding-32">
    <a href="https://github.com" target="_blank" class="w3-hover-opacity" style="margin:0 15px;"><i class="bi bi-github" style="font-size:2rem;"></i></a>
    <a href="https://gmail.com" target="_blank" class="w3-hover-opacity" style="margin:0 15px;"><i class="bi bi-envelope-fill" style="font-size:2rem;"></i></a>
    <a href="https://linkedin.com" target="_blank" class="w3-hover-opacity" style="margin:0 15px;"><i class="bi bi-linkedin" style="font-size:2rem;"></i></a>
</footer>

</div>

<script>
function toggleNav() {
    var sidenav = document.getElementById("mySidenav");
    sidenav.classList.toggle("active");
}

function toggleDropdown() {
    var dropdown = document.getElementById("dropdown");
    if (dropdown.style.display === "block") {
        dropdown.style.display = "none";
    } else {
        dropdown.style.display = "block";
    }
}
</script>
</body>
</html>
